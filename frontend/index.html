<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IsItTrue — is that message true?</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 36 36" width="56" height="56">
          <circle cx="18" cy="18" r="17" class="logo-ring" />
          <path d="M10 19 L15 24 L26 12" class="logo-check" />
        </svg>
      </div>
      <h1>IsItTrue</h1>
      <p class="subtitle">Paste a forwarded message, news snippet, or claim someone told you — we'll break down what's actually true.</p>
    </header>

    <section class="input-card">
      <textarea
        id="text-input"
        placeholder="Paste the message here, or attach/paste a screenshot below..."
        maxlength="3000"
        rows="8"
      ></textarea>

      <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp" hidden />
      <div id="image-preview" class="image-preview" hidden>
        <img id="image-preview-img" alt="Attached image preview" />
        <button id="image-remove-btn" type="button" class="remove-image-btn" aria-label="Remove attached image">✕</button>
      </div>

      <div class="input-row">
        <span id="char-count" class="char-count">0 / 3000</span>
        <div class="input-row-buttons">
          <button id="clear-btn" type="button" class="secondary-btn">🧹 Clear</button>
          <button id="attach-btn" type="button" class="secondary-btn">📎 Attach image</button>
          <button id="check-btn" type="button" class="primary-btn">Check this</button>
        </div>
      </div>
    </section>

    <section id="status" class="status" hidden>
      <span id="status-text"></span>
      <span id="status-dots" class="status-dots" hidden><span></span><span></span><span></span></span>
    </section>

    <section id="result" class="result" hidden>
      <div id="result-counts" class="result-counts"></div>
      <p id="result-summary" class="result-summary"></p>
      <div id="result-claims" class="result-claims"></div>
    </section>

    <footer class="footer">
      <p>
        Verdicts are generated by AI and can be wrong — use your own judgment,
        especially for anything important.
      </p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
